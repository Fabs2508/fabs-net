<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../img/FabsTracker_Logo.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../../css/home/settings.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../../css/home/header.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../../css/home/sidebar.css" media="screen and (min-width: 901px)">

    <link rel="stylesheet" href="../../../css_small/home/settings.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../../css_small/home/header.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../../css_small/home/bottom-nav.css" media="screen and (max-width: 900px)">
    
    <title>FabsTracker | Einstellungen</title>
</head>
<body>
    <header class="header">
        <div class="header-inner">
        <img src="../../../img/FabsTracker_Logo.ico" alt="Logo" class="logo">

        <h3 id="h3username">username</h3>

        <div class="profile-wrapper">
            <div class="profile-icon" id="profileBtn">
            <img src="../../../img/standart_user.png" alt="profile">
            </div>

            <div class="dropdown" id="profileDropdown">
                <a href="">Einstellungen</a>

                <div class="dropdown-item switch-row">
                    <span>Theme</span>

                    <label class="switch">
                    <input type="checkbox" id="themeSwitch">
                    <span class="slider"></span>
                    </label>
                </div>
                <button id="logoutBtn">Logout</button>
            </div>
        </div>
        </div>
    </header>

    <nav class="sidebar">
        <button data-tab="home" class="active">👤&nbsp<span>Mein Profil</span></button>
        <button data-tab="foodtracker" disabled>🍴&nbsp<span>FoodTracker</span></button>
        <button data-tab="trainingsplan">📄&nbsp<span>g</span></button>
        <button data-tab="contracts" disabled>📄&nbsp<span>Fortschritte</span></button>
        <span class="label">Mehr</span>
        <button data-tab="griptrainer" disabled>💪&nbsp<span>Griptrainer</span></button>
    </nav>

    <div class="settings-box" style="height: 2000px;">
        <h1>Mein Profil</h1>
        <div id="message"></div>

        <div class="profile-box">
            <img class="pfp" src="../../../img/standart_user.png" draggable="false">
            <div class="edit-overlay">
                <span class="pencil-icon">✎</span>
            </div>
            <p></p>
        </div>

    </div>

    <nav class="bottom-nav">
      <button data-tab="home" class="active">👤<span>Mein Profil</span></button>
      <button data-tab="analytics" disabled>g<span>Tracks</span></button>
      <button data-tab="trainingsplan">📄<span>Trainingsplan</span></button>
    </nav>

    <script src="settings.js"></script>
    <script src="../bottom-nav.js"></script>
    <script src="../sidebar.js"></script>
    <script src="../header.js"></script>
</body>
</html>
