<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../../img/FabsTracker_Logo.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../../../css/home/more/griptrainer.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../../../css/home/sidebar.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../../../css/home/header.css" media="screen and (min-width: 901px)">

    <link rel="stylesheet" href="../../../../css_small/home/more/griptrainer.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../../../css_small/home/header.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../../../css_small/home/bottom-nav.css" media="screen and (max-width: 900px)">

    <title>FabsTracker | Griptrainer</title>
</head>
<body>
    <header class="header">
        <div class="header-inner">
        <img src="../../../../img/FabsTracker_Logo.ico" alt="Logo" class="logo">

        <div class="profile-wrapper">
            <div class="profile-icon" id="profileBtn">
            <img src="../../../../img/standart_user.png" alt="profile">
            </div>

            <div class="dropdown" id="profileDropdown">
            <a href="/FabsTracker/de/home/settings/index.html">Einstellungen</a>

            <div class="dropdown-item switch-row">
                <span>Theme</span>

                <label class="switch">
                <input type="checkbox" id="themeSwitch">
                <span class="slider"></span>
                </label>
            </div>

            <button id="logoutBtn">Logout</button>
            </div>
        </div>
        </div>
    </header>

    <nav class="sidebar">
        <button data-tab="home">🏠&nbsp<span>Home</span></button>
        <button data-tab="foodtracker" disabled>🍴&nbsp<span>FoodTracker</span></button>
        <button data-tab="trainingsplan">📄&nbsp<span>Trainingsplan</span></button>
        <button data-tab="contracts" disabled>📄&nbsp<span>Fortschritte</span></button>
        <span class="label">Mehr</span>
        <button data-tab="griptrainer" class="active">💪&nbsp<span>Griptrainer</span></button>
    </nav>

    <h1>Griptrainer Kalibrierungs App</h1>

    <div class="main-box" style="height: 2000px;">
        <div id="message">Ladet...</div>
        
        <!-- Kalibrierungsschritte -->
        <div id="calibration-area" style="display: none; padding: 20px; text-align: center;">
            <div id="step-1">
                <p>Schritt 1: Stell den Gripper auf das Minimum (5kg) ein.</p>
                <button class="action-btn" onclick="goToStep(2)">Weiter</button>
            </div>
            
            <div id="step-2" style="display: none; text-align: center;">
                <p>Drehe den Gripper auf Maximum und zähle die Umdrehungen:</p>
                
                <div class="counter-container">
                    <button class="counter-btn" onclick="changeTurns(-1)">−</button>
                    <div id="turnsValue">0</div>
                    <button class="counter-btn" onclick="changeTurns(1)">+</button>
                </div>

                <button class="action-btn save-btn" onclick="finishCalibration()">Kalibrierung speichern</button>
            </div>
        </div>

        <!-- Training-Anzeige (wenn kalibriert) -->
        <div id="training-area" style="display: none; padding: 20px; text-align: center;">
            <h2>Aktueller Widerstand</h2>
            <div id="weight-display" style="font-size: 3rem; margin: 20px 0;">-- kg</div>
            <p>Stell deine aktuelle Umdrehung ein:</p>
            <input type="range" id="turnSlider" min="0" value="0" step="0.1" style="width: 80%;">
            <div id="current-turn-label">0 Umdrehungen</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button data-tab="home">🏠<span>Home</span></button>
        <button data-tab="analytics" disabled>🍴<span>FoodTracker</span></button>
        <button data-tab="trainingsplan">📄<span>Trainingsplan</span></button>
        <button data-tab="contracts" disabled>📄<span>Fortschritte</span></button>
        <button data-tab="more" class="active">➕<span>Mehr</span></button>
    </nav>

    <script src="griptrainer.js"></script>
    <script src="../../sidebar.js"></script>
    <script src="../../bottom-nav.js"></script>
    <script src="../../header.js"></script>
</body>
</html>
