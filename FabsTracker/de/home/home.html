<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../img/FabsTracker_Logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="../../css/home/home.css" media="screen and (min-width: 801px)">

    <button data-tab="analytics" disabled>📊<span>Tracks</span></button>
    <button data-tab="trainingsplan">📄<span>Trainingsplan</span></button>
