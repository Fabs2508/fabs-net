<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../img/FabsTracker_Logo.ico" type="image/x-icon">

    <link rel="stylesheet" href="../../../css/home/trainingsplan.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../../css/home/header.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../../css/home/sidebar.css" media="screen and (min-width: 901px)">
    
    <link rel="stylesheet" href="../../../css_small/home/trainingsplan.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../../css_small/home/header.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../../css_small/home/bottom-nav.css" media="screen and (max-width: 900px)">

    <script src="../../heartbeat.js"></script>

    <title>FabsTracker | Trainingsplan</title>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <img src="../../../img/FabsTracker_Logo.ico" draggable="false" alt="Logo" class="logo">

      <h3 id="h3username"></h3>

      <div class="profile-wrapper">
        <div class="profile-icon" id="profileBtn">
          <img src="../../../img/standart_user.png" draggable="false" alt="profile">
        </div>

        <div class="dropdown" id="profileDropdown">
          <a href="/FabsTracker/de/home/settings/index.html">Einstellungen</a>

          <div class="dropdown-item switch-row">
            <span>Theme</span>

            <label class="switch">
              <input type="checkbox" id="themeSwitch">
              <span class="slider"></span>
            </label>
          </div>

          <button id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="sidebar">
    <button data-tab="home">🏠&nbsp<span>Home</span></button>
    <button data-tab="foodtracker" disabled>🍴&nbsp<span>FoodTracker</span></button>
    <button data-tab="trainingsplan" class="active">📄&nbsp<span>Trainingsplan</span></button>
    <button data-tab="contracts" disabled>📄&nbsp<span>Fortschritte</span></button>
    <span class="label">Mehr</span>
    <button data-tab="griptrainer">💪&nbsp<span>Griptrainer</span></button>
  </nav>

  <main class="trainingsplan-box">
    <div class="plan-toolbar">
      <button id="prev-week-btn" class="icon-btn" type="button" aria-label="Vorherige Woche">‹</button>
      <div>
        <h1>Trainingsplan</h1>
        <p id="week-label"></p>
      </div>
      <button id="next-week-btn" class="icon-btn" type="button" aria-label="Nächste Woche">›</button>
    </div>

    <section class="planner-layout">
      <aside class="exercise-palette" id="exercise-palette" aria-label="Trainingsarten">
        <h2>Bausteine</h2>
        <button class="palette-item calisthenics" draggable="true" data-type="calisthenics" data-title="Calisthenics">Calisthenics</button>
        <button class="palette-item push" draggable="true" data-type="push" data-title="Push">Push</button>
        <button class="palette-item pull" draggable="true" data-type="pull" data-title="Pull">Pull</button>
        <button class="palette-item legs" draggable="true" data-type="legs" data-title="Beine">Beine</button>
        <button class="palette-item core" draggable="true" data-type="core" data-title="Bauch">Bauch</button>
        <button class="palette-item back" draggable="true" data-type="back" data-title="Lat/Rücken">Lat/Rücken</button>
        <button class="palette-item chest" draggable="true" data-type="chest" data-title="Brust">Brust</button>
        <button class="palette-item arms" draggable="true" data-type="arms" data-title="Arme">Arme</button>
        <button class="palette-item cardio" draggable="true" data-type="cardio" data-title="Cardio">Cardio</button>
        <button class="palette-item rest" draggable="true" data-type="rest" data-title="Restday">Restday</button>
        <button id="custom-exercise-btn" class="palette-add-btn" type="button" aria-label="Eigenen Baustein hinzufügen">+</button>
      </aside>

      <section class="week-grid" id="week-grid" aria-label="Wochenplan"></section>
    </section>

    <div id="message"></div>

    <button id="repeat-future-btn" class="repeat-btn" type="button" style="display: none;">Für folgende Wochen übernehmen</button>

    <div id="custom-modal" class="custom-modal" style="display: none;">
      <div class="custom-dialog">
        <h3>Eigener Baustein</h3>
        <label>
          <p id="custom-">Name</p>
          <input id="custom-name-input" type="text" maxlength="32" autocomplete="off">
        </label>
        <label>
          <p>Farbe</p>
          <input id="custom-color-input" type="color" value="#2bbcff">
        </label>
        <div class="custom-actions">
          <button id="custom-cancel" class="icon-btn text-btn" type="button">Abbrechen</button>
          <button id="custom-save" class="save-btn modal-save-btn" type="button">Hinzufügen</button>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button data-tab="home">🏠<span>Home</span></button>
    <button data-tab="analytics" disabled>🍴<span>FoodTracker</span></button>
    <button data-tab="trainingsplan" class="active">📄<span>Trainingsplan</span></button>
    <button data-tab="contracts" disabled>📄<span>Fortschritte</span></button>
    <button data-tab="more">➕<span>Mehr</span></button>
  </nav>

  <script src="trainingsplan.js"></script>
  <script src="../sidebar.js"></script>
  <script src="../bottom-nav.js"></script>
  <script src="../header.js"></script>
</body>
</html>
