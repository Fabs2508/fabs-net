<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../img/FabsTracker_Logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/login.css">
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <title>FabsTracker | Registrieren</title>
</head>
<body>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <header class="header">
      <div class="header-inner">
          <img src="../../img/FabsTracker_Logo.ico" alt="Logo" class="logo">

          <nav id="nav"></nav>
      </div>
  </header>

  <div class="bg shape1"></div>
  <div class="bg shape2"></div>

  <div class="login-box">
    <h1>Registrieren</h1>

    <label for="username">Benutzername</label>
    <input type="text" id="username" placeholder="Dein Benutzername">

    <label for="email">E-Mail</label>
    <input type="email" id="email" placeholder="Deine E-Mail">

    <label for="password">Passwort</label>
    <input type="password" id="password" placeholder="Passwort erstellen">

    <label for="confirm">Passwort bestätigen</label>
    <input type="password" id="confirm" placeholder="Passwort wiederholen">

    <div id="turnstile-widget" class="cf-turnstile" data-sitekey="0x4AAAAAACxkzvwcCcm17Klp"></div>

    <h3 class="msg"></h3>

    <button class="btn">Registrieren</button>

    <div class="extra">
      Schon einen Account? <a href="../login/login.html">Anmelden</a>
    </div>
  </div>
  <script src="signup.js"></script>
</body>
</html>
