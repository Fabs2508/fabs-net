<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../img/FabsTracker_AdminLogo.png" type="image/x-icon">

    <link rel="stylesheet" href="../../css/admin/admin.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../css/home/header.css" media="screen and (min-width: 901px)">
    <link rel="stylesheet" href="../../css/home/sidebar.css" media="screen and (min-width: 901px)">

    <link rel="stylesheet" href="../../css_small/admin/admin.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../css_small/home/header.css" media="screen and (max-width: 900px)">
    <link rel="stylesheet" href="../../css_small/home/bottom-nav.css" media="screen and (max-width: 900px)">

    <script src="../heartbeat.js"></script>

    <title>FabsTracker | Admin Dashboard</title>
</head>
<body>

    <header class="header">
        <div class="header-inner">
        <img src="../../img/FabsTracker_AdminLogo.png" alt="Logo" class="logo">

        <h3 id="h3username">username</h3>

        <div class="profile-wrapper">
            <div class="profile-icon" id="profileBtn">
            <img src="../../img/standart_user.png" alt="profile">
            </div>

            <div class="dropdown" id="profileDropdown">
            <a href="/FabsTracker/de/home/settings/index.html">Einstellungen</a>

            <div class="dropdown-item switch-row">
                <span>Theme</span>

                <label class="switch">
                <input type="checkbox" id="themeSwitch">
                <span class="slider"></span>
                </label>
            </div>

            <button id="logoutBtn">Logout</button>
            </div>
        </div>
        </div>
    </header>

    <nav class="sidebar">
        <button data-tab="home">🏠&nbsp<span>Home</span></button>
        <button data-tab="foodtracker" disabled>🍴&nbsp<span>FoodTracker</span></button>
        <button data-tab="trainingsplan">📄&nbsp<span>Trainingsplan</span></button>
        <button data-tab="contracts" disabled>📄&nbsp<span>Fortschritte</span></button>
        <span class="label">Mehr</span>
        <button data-tab="griptrainer">💪&nbsp<span>Griptrainer</span></button>
    </nav>

    <div class="admin-box">
        <h1>Admin Dashboard</h1>

        <div id="message"></div>

        <div id="actions"></div>
    </div>

    <nav class="bottom-nav">
        <button data-tab="home">🏠<span>Home</span></button>
        <button data-tab="foodtracker" disabled>🍴<span>FoodTracker</span></button>
        <button data-tab="trainingsplan">📄<span>Trainingsplan</span></button>
        <button data-tab="contracts" disabled>📄<span>Fortschritte</span></button>
        <button data-tab="more">➕<span>Mehr</span></button>
    </nav>

    <script src="../home/header.js"></script>
    <script src="../home/bottom-nav.js"></script>
    <script src="../home/sidebar.js"></script>
    <script src="admin.js"></script>
</body>
</html>
