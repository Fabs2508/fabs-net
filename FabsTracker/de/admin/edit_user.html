<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../img/FabsTracker_AdminLogo.png" type="image/x-icon">
    <!-- Für PC / Große Bildschirme (ab 1024px Breite) -->
  <link rel="stylesheet" href="../../css/admin/edit_user.css" media="screen and (min-width: 1025px)">

  <!-- Für Handy / Kleine Bildschirme (bis 1024px Breite) -->
  <link rel="stylesheet" href="../../css_small/admin/edit_user.css" media="screen and (max-width: 1024px)">

  <title>FabsTracker | Benutzer bearbeiten</title>
  <script defer src="edit_user.js"></script>
</head>

<body>

  <!-- Hintergrund Shapes -->
  <div class="bg shape1"></div>
  <div class="bg shape2"></div>

  <!-- Admin Box -->
  <div class="admin-box">
    <button id="backButton">Zurück</button>
    <h1>User Bearbeiten</h1>

    <div id="message"></div>

    <div class="table-wrapper">
      <table id="usersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Password</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Wird dynamisch gefüllt -->
        </tbody>
      </table>
    </div>

    <div class="create-user">
      <h2>Neuen User erstellen</h2>
      <input type="text" id="newUsername" placeholder="Username">
      <input type="email" id="newEmail" placeholder="Email">
      <input type="password" id="newPassword" placeholder="Password">
      <select id="newRole">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <button id="createUserButton">Erstellen</button>
      <div class="ignoreEmptyFields">
        <p>Leere Felder ignorieren</p>
        <label class="switch">
          <input id="switch" type="checkbox">
          <span class="slider round"></span>
        </label>
      </div>
      
  </div>

  <div id="secondmessage" class="extra"></div>

</body>
</html>
