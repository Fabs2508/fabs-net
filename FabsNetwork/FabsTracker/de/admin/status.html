<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../img/FabsTracker_AdminLogo.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/admin/status.css" media="screen and (min-width: 1025px)">
    <link rel="stylesheet" href="../../css_small/admin/status.css" media="screen and (max-width: 1024px)">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>FabsTracker | Server Status</title>
</head>
<body>
    
    <div id="message"></div>

    <div class="node-box" id="node-box">

        <button id="backButton">Zurück</button>

        <h2>Node.js Status</h2>

        <canvas id="cpuChart" style="display: none;"></canvas>

        <table table>
            <tr>
                <td>Status</td>
                <td><span id="node_statusValue">-</span></td>
            </tr>
            <tr>
                <td>CPU Load</td>
                <td id="node_cpu">-</td>
            </tr>
            <tr>
                <td>Memory Free</td>
                <td id="node_memory">-</td>
            </tr>
            <tr>
                <td>Uptime</td>
                <td id="node_uptime">-</td>
            </tr>
            <tr>
                <td>Node</td>
                <td id="node_version">-</td>
            </tr>
        </table>
        <button id="node_refresh">Refresh</button>
    </div>

    <div class="pi-box">
        <h2>PI Status</h2>
        <table>
            <tr>
                <td>Status</td>
                <td><span id="pi_statusValue">-</span></td>
            </tr>
            <tr>
                <td>CPU</td>
                <td id="pi_cpu">-</td>
            </tr>
            <tr>
                <td>Memory</td>
                <td id="pi_memory">-</td>
            </tr>
            <tr>
                <td>CPU Temp°</td>
                <td id="pi_cpu_temp">-</td>
            </tr>
            <tr>
                <td>GPU Temp°</td>
                <td id="pi_gpu_temp">-</td>
            </tr>

            <tr class="pi-more1">
                <td>Volts</td>
                <td id="pi_volts">-</td>
            </tr>
            <tr class="pi-more2">
                <td>Uptime</td>
                <td id="pi_uptime">-</td>
            </tr>
        </table>
        <button id="pi_more">Mehr</button>
        <button id="pi_refresh">Refresh</button>
    </div>

    <script src="status.js"></script>
</body>
</html>
