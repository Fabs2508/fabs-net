<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuchen Clicker Mobile</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  /* Dunkler, moderner Farbverlauf im Hintergrund */
  background: linear-gradient(135deg, #0f0c1b, #201a30, #0f0c1b);
  background-attachment: fixed;
  color: #f0eaf8;
  text-align: center;
  display: flex;
  min-height: 100vh;
  overflow-x: hidden;
}

/* HAUPTBEREICH (LINKS) */
#main-content {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-right: 90px; /* Platz für die rechte Sidebar */
}

/* TOP BAR */
#topbar {
  width: 100%;
  max-width: 500px;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  border-radius: 16px;
  margin-bottom: 20px;
  /* Glassmorphism */
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}

/* GAME AREA & TABS */
.tab {
  display: none;
  width: 100%;
  max-width: 500px;
}

.active {
  display: block;
}

/* CAKE */
#cake {
  font-size: 140px;
  margin: 40px 0;
  cursor: pointer;
  user-select: none;
  transition: transform 0.05s;
  display: inline-block;
  filter: drop-shadow(0 0 20px rgba(255, 179, 102, 0.2));
}

#cake:active {
  transform: scale(0.92);
}

/* CARD STYLE (Glassmorphism) */
.card {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  margin: 20px 0;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
}

.card div, .card p {
  margin: 8px 0;
  font-size: 16px;
  letter-spacing: 0.5px;
}

/* BUTTONS */
button {
  padding: 14px 24px;
  margin: 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  background: rgba(255, 179, 102, 0.15);
  color: #ffcc99;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s, transform 0.1s, box-shadow 0.3s;
  backdrop-filter: blur(4px);
}

button:hover:not(:disabled) {
  background: rgba(255, 179, 102, 0.25);
  box-shadow: 0 0 15px rgba(255, 179, 102, 0.3);
}

button:active {
  transform: scale(0.96);
}

button:disabled {
  background: rgba(255, 255, 255, 0.02);
  border-color: rgba(255, 255, 255, 0.05);
  color: #666666;
  cursor: not-allowed;
  box-shadow: none;
}

/* RECHTE SIDEBAR (Glassmorphism) */
#nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 80px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(255, 255, 255, 0.02);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-left: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: -8px 0 32px 0 rgba(0, 0, 0, 0.3);
  z-index: 100;
}

#nav button {
  width: 60px;
  height: 60px;
  margin: 15px 0;
  border-radius: 14px;
  font-size: 22px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.02);
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.05);
}

#nav button:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #ffcc99;
}

#nav button.active-nav {
  background: rgba(255, 179, 102, 0.2);
  border-color: rgba(255, 179, 102, 0.4);
  color: #ffcc99;
}

.reset-btn {
  background: rgba(255, 85, 85, 0.1) !important;
  color: #ff8888 !important;
  border-color: rgba(255, 85, 85, 0.2) !important;
}
.reset-btn:hover {
  background: rgba(255, 85, 85, 0.2) !important;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="tutorial-music-meme.mp3" type="audio/mpeg">
  Dein Browser unterstützt dieses Audio-Element nicht.
</audio>

<!-- HAUPTBEREICH -->
<div id="main-content">
  <div id="topbar">
    🍰 Kuchen Clicker Mobile
  </div>

  <!-- GAME -->
  <div id="game" class="tab active">
    <div class="card">
      <div id="score">Punkte: 0</div>
      <div id="rp">RP: 0</div>
      <div id="multi">Multiplikator: x1</div>
      <div id="clickPower">Punkte pro Klick: 1</div>
      <div id="idlePower">Autom. Punkte: 0/s</div>
    </div>

    <div id="cake">🍰</div>
    <button onclick="startMusic()">Musik</button>

    <div class="card">
      <h3>Upgrades</h3>
      <button id="upgradeBtn">Klick-Upgrade (10)</button>
      <button id="idleBtn">Oma kaufen (+1/s) (50)</button>
    </div>
  </div>

  <!-- SHOP -->
  <div id="shop" class="tab">
    <div class="card">
      <h3>🛒 Daily Shop</h3>
      <div id="shopItems"></div>
    </div>
  </div>

  <!-- SKINS -->
  <div id="skins" class="tab">
    <div class="card">
      <h3>Skins</h3>
      <button onclick="setSkin('🍰')">🍰 Kuchen</button>
      <button onclick="setSkin('🍪')">🍪 Keks</button>
      <button onclick="setSkin('🍩')">🍩 Donut</button>
      <button onclick="setSkin('🧁')">🧁 Cupcake</button>
    </div>
  </div>

  <!-- REBIRTH -->
  <div id="rebirth" class="tab">
    <div class="card">
      <h3>Rebirth</h3>
      <p>Setzt Punkte und Upgrades zurück.</p>
      <p>Gewährt dauerhaft +1 Multiplikator und +1 RP.</p>
      <button id="rebirthBtn" onclick="rebirth()">Rebirth (100 Punkte)</button>
    </div>
    
    <div class="card">
      <h3>Gefahrenzone</h3>
      <button class="reset-btn" onclick="resetGame()">Spielstand komplett löschen</button>
    </div>
  </div>
</div>

<!-- RECHTE SIDEBAR -->
<div id="nav">
  <button id="nav-game" class="active-nav" onclick="show('game')">🏠</button>
  <button id="nav-shop" onclick="show('shop')">🛒</button>
  <button id="nav-skins" onclick="show('skins')">🎨</button>
  <button id="nav-rebirth" onclick="show('rebirth')">🔁</button>
</div>

<script>
// Spiel-Variablen
let score = 0;
let rp = 0;
let multi = 1;
let clickUpgrade = 1; 
let cost = 10;
let idleLevel = 0;
let idleCost = 50;
let currentSkin = '🍰';
let shop = [];

// DOM Elemente
const cake = document.getElementById("cake");
const shopDiv = document.getElementById("shopItems");
const upgradeBtn = document.getElementById("upgradeBtn");
const idleBtn = document.getElementById("idleBtn");
const rebirthBtn = document.getElementById("rebirthBtn");
const scoreTxt = document.getElementById("score");
const rpTxt = document.getElementById("rp");
const multiTxt = document.getElementById("multi");
const clickPowerTxt = document.getElementById("clickPower");
const idlePowerTxt = document.getElementById("idlePower");

const bgMusic = document.getElementById("bgMusic");
let musicStarted = false; // Verhindert, dass die Musik bei jedem Klick neu startet

function startMusic() {
  if (!musicStarted) {
    bgMusic.volume = 0.1; // Lautstärke auf 30% stellen (schont die Ohren)
    bgMusic.preservePitch = false; // Verhindert Tonhöhenänderungen
    bgMusic.playbackRate = 1; // Normale Abspielgeschwindigkeit
    bgMusic.play().then(() => {
      musicStarted = true;
    }).catch(error => {
      console.log("Autoplay von Browser blockiert. Wartet auf Interaktion." + error);
    });
  }
}

/* NAVIGATION */
function show(id){
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll("#nav button").forEach(b => b.classList.remove("active-nav"));
  
  document.getElementById(id).classList.add("active");
  document.getElementById("nav-" + id).classList.add("active-nav");
}

/* CAKE CLICK */
cake.onclick = () => {
  score += clickUpgrade * multi;
  updateUI();
  saveGame();
};

/* UPGRADE */
upgradeBtn.onclick = () => {
  if(score >= cost){
    score -= cost;
    clickUpgrade += 1;
    cost = Math.floor(cost * 1.5);
    updateUI();
    saveGame();
  }
};

/* AUTOMATISCHES KLICK-UPGRADE (IDLE) */
idleBtn.onclick = () => {
  if(score >= idleCost){
    score -= idleCost;
    idleLevel += 1;
    idleCost = Math.floor(idleCost * 1.6);
    updateUI();
    saveGame();
  }
};

/* AUTOMATISCHE PUNKTE-SCHLEIFE */
setInterval(() => {
  if (idleLevel > 0) {
    score += idleLevel * multi;
    updateUI();
    if (Math.random() < 0.1) saveGame(); 
  }
}, 1000);

/* REBIRTH */
function rebirth(){
  if(score >= 100){
    score = 0;
    clickUpgrade = 1;
    cost = 10;
    idleLevel = 0;
    idleCost = 50;
    multi++;
    rp++;
    updateUI();
    saveGame();
  }
}

/* SKIN */
function setSkin(s){
  currentSkin = s;
  cake.textContent = s;
  saveGame();
}

/* LOCALSTORAGE */
function saveGame() {
  const gameState = { score, rp, multi, clickUpgrade, cost, idleLevel, idleCost, currentSkin };
  localStorage.setItem("kuchenClickerSave", JSON.stringify(gameState));
}

function loadGame() {
  const savedData = localStorage.getItem("kuchenClickerSave");
  if (savedData) {
    const data = JSON.parse(savedData);
    score = data.score ?? 0;
    rp = data.rp ?? 0;
    multi = data.multi ?? 1;
    clickUpgrade = data.clickUpgrade ?? 1;
    cost = data.cost ?? 10;
    idleLevel = data.idleLevel ?? 0;
    idleCost = data.idleCost ?? 50;
    currentSkin = data.currentSkin ?? '🍰';
    cake.textContent = currentSkin;
  }
}

function resetGame() {
  if (confirm("Möchtest du das gesamte Spiel wirklich zurücksetzen?")) {
    localStorage.removeItem("kuchenClickerSave");
    location.reload();
  }
}

/* SHOP */
function genShop(){
  const items = [
    {s:"🍪", c:1, name: "Keks-Bonus"},
    {s:"🍩", c:2, name: "Donut-Bonus"},
    {s:"🧁", c:3, name: "Cupcake-Bonus"},
    {s:"🍫", c:2, name: "Schoko-Schub"},
    {s:"🍓", c:1, name: "Erdbeer-Segen"},
    {s:"🍌✨", c:5, name: "Goldene Banane"}
  ];
  shop = items.sort(() => Math.random() - 0.5).slice(0, 3);
}

function renderShop(){
  shopDiv.innerHTML = "";
  shop.forEach(i => {
    let b = document.createElement("button");
    b.textContent = `${i.s} ${i.name} (${i.c} RP)`;
    if (rp < i.c) b.disabled = true;

    b.onclick = () => {
      if(rp >= i.c){
        rp -= i.c;
        score += 50 * multi;
        if(i.s === "🍌✨"){
          alert("🍌 GOLDENE BANANE FREIGESCHALTET!");
        }
        updateUI();
        saveGame();
      }
    };
    shopDiv.appendChild(b);
  });
}

/* UI AKTUALISIEREN */
function updateUI(){
  scoreTxt.textContent = "Punkte: " + score;
  rpTxt.textContent = "RP: " + rp;
  multiTxt.textContent = "Multiplikator: x" + multi;
  clickPowerTxt.textContent = "Punkte pro Klick: " + (clickUpgrade * multi);
  idlePowerTxt.textContent = "Autom. Punkte: " + (idleLevel * multi) + "/s";

  upgradeBtn.textContent = "Klick-Upgrade (" + cost + ")";
  upgradeBtn.disabled = score < cost;
  
  idleBtn.textContent = `Oma kaufen (+${1 * multi}/s) (${idleCost})`;
  idleBtn.disabled = score < idleCost;
  
  rebirthBtn.disabled = score < 100;

  renderShop();
}

/* INITIALISIERUNG */
function init(){
  loadGame();
  genShop();
  updateUI();
}

init();
</script>

</body>
</html>
