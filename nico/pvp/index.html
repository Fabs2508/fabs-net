<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuchen-Klicker Multiplayer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .player {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            min-width: 280px;
        }

        .player h2 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .player.p2 h2 {
            color: #3498db;
        }

        .score {
            font-size: 3rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
        }

        .cake-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 80px;
            background: linear-gradient(145deg, #fff5e6, #ffe4c4);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
        }

        .cake-btn:hover {
            transform: scale(1.05);
        }

        .cake-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .controls {
            margin-top: 15px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .controls kbd {
            background: #ecf0f1;
            padding: 5px 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 1.1rem;
            border: 1px solid #bdc3c7;
        }

        .winner-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 100;
            display: none;
        }

        .winner-banner h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .winner-banner button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
        }

        .winner-banner button:hover {
            background: #2ecc71;
        }

        .goal {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.3rem;
            color: #2c3e50;
        }

        .goal span {
            font-weight: bold;
            color: #e74c3c;
        }

        .click-effect {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            animation: float-up 0.8s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.5);
            }
        }
    </style>
</head>
<body>
    <div>
        <div class="goal">Ziel: <span id="goal">50</span> Kuchen 🎂</div>
        
        <div class="game-container">
            <div class="player p1">
                <h2>🔴 Spieler 1</h2>
                <div class="score" id="score1">0</div>
                <button class="cake-btn" id="cake1">🎂</button>
                <div class="controls">Taste: <kbd>Q</kbd></div>
            </div>

            <div class="player p2">
                <h2>🔵 Spieler 2</h2>
                <div class="score" id="score2">0</div>
                <button class="cake-btn" id="cake2">🎂</button>
                <div class="controls">Taste: <kbd>P</kbd></div>
            </div>
        </div>
    </div>

    <div class="winner-banner" id="winner">
        <h1 id="winner-text">🏆 Spieler 1 gewinnt! 🏆</h1>
        <p>🎂🎂🎂</p>
        <button onclick="resetGame()">Nochmal spielen</button>
    </div>

    <script>
        const GOAL = 50;
        let score1 = 0;
        let score2 = 0;
        let gameOver = false;

        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');
        const cake1 = document.getElementById('cake1');
        const cake2 = document.getElementById('cake2');
        const winnerBanner = document.getElementById('winner');
        const winnerText = document.getElementById('winner-text');

        function createClickEffect(element) {
            const rect = element.getBoundingClientRect();
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.textContent = '+1 🍰';
            effect.style.left = rect.left + rect.width / 2 - 20 + 'px';
            effect.style.top = rect.top + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 800);
        }

        function click1() {
            if (gameOver) return;
            score1++;
            score1El.textContent = score1;
            createClickEffect(cake1);
            checkWin();
        }

        function click2() {
            if (gameOver) return;
            score2++;
            score2El.textContent = score2;
            createClickEffect(cake2);
            checkWin();
        }

        function checkWin() {
            if (score1 >= GOAL) {
                gameOver = true;
                winnerText.textContent = '🏆 Spieler 1 gewinnt! 🏆';
                winnerBanner.style.display = 'block';
            } else if (score2 >= GOAL) {
                gameOver = true;
                winnerText.textContent = '🏆 Spieler 2 gewinnt! 🏆';
                winnerBanner.style.display = 'block';
            }
        }

        function resetGame() {
            score1 = 0;
            score2 = 0;
            gameOver = false;
            score1El.textContent = '0';
            score2El.textContent = '0';
            winnerBanner.style.display = 'none';
        }

        cake1.addEventListener('click', click1);
        cake2.addEventListener('click', click2);

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'q') {
                click1();
                cake1.style.transform = 'scale(0.95)';
                setTimeout(() => cake1.style.transform = '', 100);
            }
            if (e.key.toLowerCase() === 'p') {
                click2();
                cake2.style.transform = 'scale(0.95)';
                setTimeout(() => cake2.style.transform = '', 100);
            }
        });
    </script>
</body>
</html>
