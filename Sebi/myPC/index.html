<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Für PC -->
    <link rel="stylesheet" href="../css/style.css" media="screen and (min-width: 1025px)">

    <!-- Für Handy -->
    <link rel="stylesheet" href="../css_small/style.css" media="screen and (max-width: 1024px)">

    <link rel="stylesheet" href="myPC.css">

    <link rel="icon" href="../img/SCP_Foundation_Logo_White.png" type="image/x-icon">

    <title>Sebi | Mein PC</title>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <img href="/de/index.html" src="../img/SCP_Foundation.png" draggable="false" alt="Logo" class="logo">

            <nav>
                <ul>
                    <li><a href="../">Startseite</a></li>
                    <li style="background: rgba(88, 101, 242, 0.25); border-radius: 10px;"><a href="myPC/">Mein PC</a></li>
                    <li><a href="../links/">Links</a></li>
                    <li><a href="../credits/">Credits</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <table class="glass-table">
            <thead>
            <tr>
                <th>Teil</th>
                <th>Name</th>
                <th>Preis</th>
            </tr>
            </thead>
            <tbody>
            <tr style="position: relative;">
                <td>CPU:</td>
                <td><a href="https://www.amazon.de/dp/B084F5Q2QD/" class="stretched-link" target="_blank">AMD Ryzen 7 3700X</a></td>
                <td class="price">181,49 €</td>
            </tr>
            <tr style="position: relative;">
                <td>GPU:</td>
                <td><a href="https://www.amazon.de/dp/B09Y57F1HL/" class="stretched-link" target="_blank">RTX 3050 Ventus 2X 8G OC</a></td>
                <td class="price">290,07 €</td>
            </tr>
            <tr style="position: relative;">
                <td>RAM:</td>
                <td><a href="https://www.amazon.de/dp/B07D1XCKWW/" class="stretched-link" target="_blank">2x8GB DDR4</a></td>
                <td class="price">162,12 €</td>
            </tr>
            <tr style="position: relative;">
                <td>SSD:</td>
                <td><a href="https://www.amazon.de/dp/B0B7CMZ3QH" class="stretched-link" target="_blank">2TB WD_BLACK</a></td>
                <td class="price">273,99 €</td>
            </tr>
            <tr style="position: relative;">
                <td>Mainboard:</td>
                <td><a href="https://www.amazon.de/dp/B08K91L574" class="stretched-link" target="_blank">Asus Prime B450M-A II</a></td>
                <td class="price">86,17 €</td>
            </tr>
             <tr style="position: relative;">
                <td>Netzteil:</td>
                <td><a class="stretched-link" target="_blank">Unbekannt 750W Gold</a></td>
                <td class="price">Unbekannt</td>
            </tbody>
            <tfoot>
                <tr style="border-top: 2px solid #000; font-weight: bold;">
                    <td colspan="2">Gesamtpreis:</td>
                    <td id="total-price"></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <p class="credits">@made by <a href="../../Fabs/">Fabs</a></p>

    <script src="myPC.js"></script>
</body>
</html>
